name: docker-publish

# 构建中控台镜像并推送到 ghcr.io，同时负责自动发版。
#
# 触发方式：
#   - push 到 deploy-center：**自动发版**。算出下一个补丁版本 → 构建冒烟 →
#     推镜像 → 回推 `chore(release)` 提交与 `vX.Y.Z` 标签。
#     只改 docs / README / openspec 时跳过（见 paths-ignore）。
#   - 推 v* 标签：手工发版，行为不变（想跳版本号或发预发布版时用）
#   - 手动触发：发布 <分支名> 与 sha-<短哈希>，可额外指定一个标签；
#     勾选 push_image 时同时更新 latest；取消勾选则只构建并冒烟、不推送
#
# 为什么自动发版和构建在同一个工作流里：用 GITHUB_TOKEN 回推的标签**不会**
# 触发工作流（Actions 的既有行为，防无限递归）。所以「推标签让另一个工作流
# 构建」这条链在自动场景下是断的——必须一次把活干完。
#
# 顺序是刻意的：**构建冒烟通过、镜像推成功之后**才改版本号打标签。反过来
# 的话，一次构建失败就白烧掉一个版本号，而且仓库里会留下一个没有对应镜像
# 的标签。
on:
  push:
    branches: ['deploy-center']
    tags: ['v*']
    # 这些路径进不了镜像（Dockerfile 只 COPY package.json/lock/tsconfig/src），
    # 改它们不该产生新版本。全部改动都落在这些路径时整个工作流不触发。
    #
    # 注意 paths-ignore 对标签推送不生效（GitHub 只对分支 push 做路径过滤），
    # 所以手工打标签发版永远会跑，不受这份清单影响。
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'openspec/**'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      extra_tag:
        description: '额外的镜像标签（可选，例如 test）'
        required: false
        default: ''
        type: string
      push_image:
        description: '推送到 ghcr（取消勾选只构建并冒烟）'
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  # 同一分支的发版串行执行：并发会让两次 push 算出同一个版本号，
  # 后打的那个标签必然失败。
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  # ghcr 的镜像名必须全小写；本仓库名已是小写
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # 要读已有标签来算下一个版本，也要能回推，所以取全历史
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      # 自动发版路径：算出下一个补丁版本。
      #
      # 基准取 package.json 与最大的 v* 标签里更大的那个：只看 package.json
      # 会在有人手工打过标签却忘了改文件时算出一个已占用的版本号。
      - name: 推导版本号
        id: version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          set -euo pipefail

          current=$(node -p "require('./package.json').version")
          echo "package.json: $current"

          latest_tag=$(git tag --list 'v*' | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1 || true)
          echo "最大标签: ${latest_tag:-（无）}"

          # 取两者较大的作为基准
          base=$(printf '%s\n%s\n' "$current" "${latest_tag:-0.0.0}" \
            | sort -t. -k1,1n -k2,2n -k3,3n | tail -n1)

          major=${base%%.*}
          rest=${base#*.}
          minor=${rest%%.*}
          patch=${rest#*.}
          next="${major}.${minor}.$((patch + 1))"

          if git rev-parse -q --verify "refs/tags/v${next}" >/dev/null; then
            echo "::error::标签 v${next} 已存在，拒绝覆盖。请手工处理后重跑"
            exit 1
          fi

          echo "下一个版本: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          # X.Y 滚动标签，与手工打标签那条路径（type=semver {{major}}.{{minor}}）
          # 对齐，否则自动发版产出的标签比手工少一个
          echo "minorTag=${major}.${minor}" >> "$GITHUB_OUTPUT"

      - name: 镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 关掉 flavor 自动生成的 latest：它会和下面显式那条重复。
          # latest 只由显式规则产生，预发布标签不会覆盖它。
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=${{ steps.version.outputs.minorTag }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.version.outputs.version != '' }}
            # 手动触发且勾选 push_image 时同样更新 latest：否则手工发布的镜像
            # 只有分支名与 sha 标签，按 latest 拉取的部署机永远拿不到它
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && inputs.push_image }}
            # 分支名标签只在手动触发时有意义。自动发版已经产出
            # X.Y.Z / X.Y / latest / sha-xxxxxxx，再加一个 deploy-center
            # 只是噪音，而且它会被下一次发版悄悄覆盖、指向谁全看时间。
            #
            # 它还抢了 OCI version 标签：type=ref 的优先级是 600，高于
            # type=raw 的 200，于是镜像的 org.opencontainers.image.version
            # 会变成「deploy-center」而不是真实版本号。
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=sha-
            type=raw,value=${{ inputs.extra_tag }},enable=${{ inputs.extra_tag != '' }}

      # 自动发版时镜像里要带上将要发布的版本号，否则容器里的 package.json
      # 还是上一版，查问题时对不上
      - name: 写入版本号
        if: steps.version.outputs.version != ''
        run: |
          set -euo pipefail
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " '${{ steps.version.outputs.version }}'
          node -p "'package.json 现在是 ' + require('./package.json').version"

      # 先只构建到本地做冒烟测试，通过了才推送
      - name: 构建（本地）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: mgc-smoke:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试
        run: |
          set -euo pipefail
          docker run -d --rm --name mgc -p 3000:3000 \
            -e MASTER_KEY=ci-smoke-master-key-0123456789 mgc-smoke:test

          # 建表、加载 better-sqlite3 需要一点时间，给 30 秒
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz -o /dev/null; then break; fi
            sleep 1
          done

          health=$(curl -fsS http://127.0.0.1:3000/healthz)
          echo "healthz: $health"
          grep -q '"status":"ok"' <<< "$health"

          # 未设口令时首页必须是首次设置页：证明 UI 与数据库都活着
          curl -fsS http://127.0.0.1:3000/ -o /tmp/index.html
          grep -q '首次设置' /tmp/index.html

          docker logs mgc

      - name: 冒烟失败时输出日志
        if: failure()
        run: docker logs mgc || true

      - name: 登录 ghcr
        if: github.event_name == 'push' || inputs.push_image
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        if: github.event_name == 'push' || inputs.push_image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      # 镜像已经推成功，现在才把版本号落到仓库并打标签。
      # 顺序反过来会在构建失败时留下一个没有镜像的标签。
      - name: 回推版本号与标签
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add package.json
          git commit -m "chore(release): 版本号升到 ${VERSION}" \
                     -m "由 docker-publish 自动发版，镜像 ${IMAGE}:${VERSION} 已推送。"
          git tag -a "v${VERSION}" -m "v${VERSION}"

          # 原子推送：提交与标签一起成功或一起失败，不留下只有标签没有提交
          # 的中间态。被别的 push 抢先时这里会失败，而镜像已经推好了——
          # 下一次 push 会从更大的基准重新算版本号。
          git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/v${VERSION}"

          echo "已发布 v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
